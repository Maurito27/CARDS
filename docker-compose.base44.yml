services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: cards_dev_password
      POSTGRES_DB: cards
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cards"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: sh -c "npm install && npx tsx watch src/index.ts"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgres://cards:cards_dev_password@db:5432/cards
      - PORT=8000
      - PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - ADMIN_EMAIL=admin@cards.local
      - ADMIN_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      - api
    ports:
      - "3000:5173"
    restart: unless-stopped

volumes:
  pgdata:
